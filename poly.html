/* =====================================

<script>
"use strict";

/* =====================================
   【16】龍淵變身資料

   數值依使用者提供的龍淵截圖整理。

   rebirth：需求轉生
   ability：力量、敏捷、體質、智力、精神
   hp：血量
   mp：魔量
   hpr：回血
   mpr：回魔
   combat：近傷、遠傷、近命、遠命、
           物減、魔減、魔攻、魔命
   mr：魔法防禦
   element：火、水、風、地屬性

   魅力為0，未列入顯示。
===================================== */

const TRANSFORMATIONS=[

  {
    id:"legend",
    name:"傳說變身",
    rebirth:1,
    ability:2,
    hp:150,
    mp:80,
    hpr:20,
    mpr:20,
    combat:1,
    mr:8,
    element:2
  },

  {
    id:"myth",
    name:"神話變身",
    rebirth:5,
    ability:3,
    hp:250,
    mp:120,
    hpr:35,
    mpr:35,
    combat:2,
    mr:12,
    element:3
  },

  {
    id:"awakening",
    name:"覺醒變身",
    rebirth:7,
    ability:4,
    hp:350,
    mp:180,
    hpr:55,
    mpr:55,
    combat:4,
    mr:16,
    element:4
  },

  {
    id:"blue",
    name:"青變",
    rebirth:10,
    ability:5,
    hp:500,
    mp:250,
    hpr:80,
    mpr:80,
    combat:6,
    mr:20,
    element:5
  },

  {
    id:"accelerated",
    name:"加速版變身",
    rebirth:13,
    ability:6,
    hp:600,
    mp:310,
    hpr:110,
    mpr:110,
    combat:8,
    mr:24,
    element:6
  }

];

/* =====================================
   【17】共用工具
===================================== */

function createElement(tag,className,text){

  const element=document.createElement(tag);

  if(className){
    element.className=className;
  }

  if(text!==undefined){
    element.textContent=text;
  }

  return element;

}

function plus(value){
  return value>0?"+"+value:String(value);
}

/* =====================================
   【18】顯示五階能力卡片
===================================== */

function renderCards(){

  const container=document.getElementById(
    "tier-cards"
  );

  container.replaceChildren();

  TRANSFORMATIONS.forEach(item=>{

    const card=createElement(
      "article",
      "card "+item.id
    );

    card.id=item.id;

    const title=createElement(
      "h3",
      "",
      item.name+"｜"+item.rebirth+"轉可使用"
    );

    card.appendChild(title);

    card.appendChild(
      createElement(
        "span",
        "requirement",
        "需求轉生："+item.rebirth+"轉"
      )
    );

    const ability=createElement(
      "div",
      "ability"
    );

    const lines=[

      "力量 "+plus(item.ability)+
      "、敏捷 "+plus(item.ability)+
      "、體質 "+plus(item.ability)+
      "、智力 "+plus(item.ability)+
      "、精神 "+plus(item.ability),

      "血量 "+plus(item.hp)+
      "、魔量 "+plus(item.mp)+
      "、回血 "+plus(item.hpr)+
      "、回魔 "+plus(item.mpr),

      "近距離傷害 "+plus(item.combat)+
      "、近距離命中 "+plus(item.combat),

      "遠距離傷害 "+plus(item.combat)+
      "、遠距離命中 "+plus(item.combat),

      "物理減免 "+plus(item.combat)+
      "、魔法減免 "+plus(item.combat),

      "魔攻 "+plus(item.combat)+
      "、魔法命中 "+plus(item.combat),

      "魔法防禦 "+plus(item.mr),

      "火屬性 "+plus(item.element)+
      "、水屬性 "+plus(item.element)+
      "、風屬性 "+plus(item.element)+
      "、地屬性 "+plus(item.element)

    ];

    lines.forEach(text=>{

      ability.appendChild(
        createElement("p","",text)
      );

    });

    card.appendChild(ability);

    container.appendChild(card);

  });

}

/* =====================================
   【19】顯示完整比較表
===================================== */

function renderTable(){

  const headings=[

    "變身分類",
    "需求轉生",

    "力量",
    "敏捷",
    "體質",
    "智力",
    "精神",

    "血量",
    "魔量",
    "回血",
    "回魔",

    "近距離傷害",
    "遠距離傷害",
    "近距離命中",
    "遠距離命中",

    "物理減免",
    "魔法減免",
    "魔攻",
    "魔法命中",
    "魔法防禦",

    "火屬性",
    "水屬性",
    "風屬性",
    "地屬性"

  ];

  const head=document.getElementById(
    "table-head"
  );

  const body=document.getElementById(
    "table-body"
  );

  head.replaceChildren();
  body.replaceChildren();

  headings.forEach(text=>{

    const cell=createElement(
      "th",
      "",
      text
    );

    cell.setAttribute("scope","col");

    head.appendChild(cell);

  });

  TRANSFORMATIONS.forEach(item=>{

    const row=createElement("tr");

    const name=createElement(
      "th",
      item.id+"-text",
      item.name
    );

    name.setAttribute("scope","row");

    row.appendChild(name);

    const values=[

      item.rebirth+"轉",

      plus(item.ability),
      plus(item.ability),
      plus(item.ability),
      plus(item.ability),
      plus(item.ability),

      plus(item.hp),
      plus(item.mp),
      plus(item.hpr),
      plus(item.mpr),

      plus(item.combat),
      plus(item.combat),
      plus(item.combat),
      plus(item.combat),

      plus(item.combat),
      plus(item.combat),
      plus(item.combat),
      plus(item.combat),

      plus(item.mr),

      plus(item.element),
      plus(item.element),
      plus(item.element),
      plus(item.element)

    ];

    values.forEach(value=>{

      row.appendChild(
        createElement("td","",value)
      );

    });

    body.appendChild(row);

  });

}

/* =====================================
   【20】啟動
===================================== */

renderCards();
renderTable();

</script>

<script id="ly-floating-fire-v4-js">

(function(){

  "use strict";

  /* =====================================
     【火苗 08】防止重複產生
  ===================================== */

  if(document.getElementById("ly-floating-fire-v4")){
    return;
  }

  /* =====================================
     【火苗 09】尋找首頁主視覺
  ===================================== */

  const hero=document.querySelector(".hero");

  if(!hero){
    return;
  }

  /* =====================================
     【火苗 10】建立特效容器
  ===================================== */

  const layer=document.createElement("div");

  layer.id="ly-floating-fire-v4";
  layer.setAttribute("aria-hidden","true");

  hero.insertBefore(layer,hero.firstChild);

  /* =====================================
     【火苗 11】火苗數量設定

     電腦：16 個火苗、22 個火星
     手機：8 個火苗、12 個火星

     以後想增加或減少數量，
     修改這裡的數字即可。
  ===================================== */

  const isMobile=window.matchMedia(
    "(max-width:600px)"
  ).matches;

  const flameCount=isMobile ? 8 : 16;
  const emberCount=isMobile ? 12 : 22;

  /* =====================================
     【火苗 12】產生固定亂數

     讓每顆火苗的位置與速度不同，
     但不會因重新整理而亂跳。
  ===================================== */

  function seededRandom(seed){

    const value=Math.sin(seed*127.1)*43758.5453;

    return value-Math.floor(value);

  }

  /* =====================================
     【火苗 13】建立小火苗
  ===================================== */

  for(let i=0;i<flameCount;i++){

    const flame=document.createElement("span");

    flame.className="ly-v4-flame";

    const x=seededRandom(i+10)*100;
    const size=5+seededRandom(i+30)*7;
    const duration=7+seededRandom(i+50)*6;
    const delay=-(seededRandom(i+70)*duration);

    flame.style.left=x+"%";

    flame.style.setProperty(
      "--flame-size",
      size+"px"
    );

    flame.style.setProperty(
      "--flame-duration",
      duration+"s"
    );

    flame.style.setProperty(
      "--flame-delay",
      delay+"s"
    );

    layer.appendChild(flame);

  }

  /* =====================================
     【火苗 14】建立餘燼火星
  ===================================== */

  for(let i=0;i<emberCount;i++){

    const ember=document.createElement("span");

    ember.className="ly-v4-ember";

    const x=seededRandom(i+110)*100;
    const size=2+seededRandom(i+130)*3;
    const duration=8+seededRandom(i+150)*8;
    const delay=-(seededRandom(i+170)*duration);

    ember.style.left=x+"%";

    ember.style.setProperty(
      "--ember-size",
      size+"px"
    );

    ember.style.setProperty(
      "--ember-duration",
      duration+"s"
    );

    ember.style.setProperty(
      "--ember-delay",
      delay+"s"
    );

    layer.appendChild(ember);

  }

})();

</script>

<style id="ly-rising-fire-style">

/* 特效固定在整個畫面，不影響點擊 */

#ly-rising-fire{
  position:fixed;
  inset:0;
  z-index:5;
  overflow:hidden;
  pointer-events:none;
}

/* 小火苗 */

#ly-rising-fire .ly-fire-flame{
  position:absolute;
  bottom:-40px;

  width:var(--fire-size,8px);
  height:calc(var(--fire-size,8px) * 2.2);

  border-radius:65% 30% 60% 40%;

  background:linear-gradient(
    to top,
    #f0440e 0%,
    #ff7b19 35%,
    #ffd16d 70%,
    rgba(255,233,166,0) 100%
  );

  box-shadow:
    0 0 7px rgba(255,115,25,.55),
    0 0 16px rgba(255,65,0,.2);

  filter:blur(.5px);
  opacity:0;

  animation:
    ly-fire-flame-rise
    var(--fire-duration,12s)
    linear
    var(--fire-delay,0s)
    infinite;
}

/* 火苗緩緩上升，左右輕微搖晃 */

@keyframes ly-fire-flame-rise{

  0%{
    transform:translate(0,0) rotate(30deg) scale(.65);
    opacity:0;
  }

  12%{
    opacity:.55;
  }

  35%{
    transform:
      translate(12px,calc(var(--fire-travel) * -.35))
      rotate(18deg)
      scale(1);
    opacity:.6;
  }

  65%{
    transform:
      translate(-10px,calc(var(--fire-travel) * -.65))
      rotate(40deg)
      scale(.8);
    opacity:.35;
  }

  85%{
    opacity:.12;
  }

  100%{
    transform:
      translate(8px,calc(var(--fire-travel) * -1))
      rotate(26deg)
      scale(.25);
    opacity:0;
  }

}

/* 細小餘燼 */

#ly-rising-fire .ly-fire-ember{
  position:absolute;
  bottom:-20px;

  width:var(--fire-size,3px);
  height:var(--fire-size,3px);
  border-radius:50%;

  background:#ffc875;

  box-shadow:
    0 0 5px rgba(255,155,49,.7),
    0 0 10px rgba(255,72,10,.35);

  opacity:0;

  animation:
    ly-fire-ember-rise
    var(--fire-duration,15s)
    linear
    var(--fire-delay,0s)
    infinite;
}

@keyframes ly-fire-ember-rise{

  0%{
    transform:translate(0,0) scale(.5);
    opacity:0;
  }

  15%{

  }

  45%{

      translate(-14px,calc(var(--fire-travel) * -.45))

      translate(12px,calc(var(--fire-travel) * -.75))

</style>

<script>
(function(){

  "use strict";

  /* 防止同一頁重複產生特效 */

  if(document.getElementById("ly-rising-fire")){
    return;
  }

  const motionPreference=window.matchMedia(
    "(prefers-reduced-motion: reduce)"
  );

  if(motionPreference.matches){
    return;
  }

  const layer=document.createElement("div");

  layer.id="ly-rising-fire";
  layer.setAttribute("aria-hidden","true");

  document.body.appendChild(layer);

  /* =====================================
     可調整設定

     電腦：12個火苗、16個餘燼
     手機：6個火苗、8個餘燼

     想減少特效，調低下面數量即可。
  ===================================== */

  const mobile=window.matchMedia(
    "(max-width:600px)"
  ).matches;

  const flameCount=mobile?6:12;
  const emberCount=mobile?8:16;

  /* 固定亂數，讓位置自然分散 */

  function random(seed){

    const value=Math.sin(seed*127.1)*43758.5453;

    return value-Math.floor(value);

  }

  /* 上升距離依畫面高度調整 */

  function updateTravel(){

    layer.style.setProperty(
      "--fire-travel",
      (window.innerHeight+100)+"px"
    );

  }

  updateTravel();

  window.addEventListener(
    "resize",
    updateTravel,
    {passive:true}
  );

  /* 建立粒子 */

  function createParticle(className,index,offset){

    const particle=document.createElement("span");

    particle.className=className;

    const isFlame=className==="ly-fire-flame";

    const position=random(index+offset)*100;

    const size=isFlame
      ?4+random(index+offset+20)*5
      :1.5+random(index+offset+20)*2;

    const duration=isFlame
      ?11+random(index+offset+40)*8
      :14+random(index+offset+40)*10;

    const delay=-random(index+offset+60)*duration;

    particle.style.left=position+"%";

    particle.style.setProperty(
      "--fire-size",
      size+"px"
    );

    particle.style.setProperty(
      "--fire-duration",
      duration+"s"
    );

    particle.style.setProperty(
      "--fire-delay",
      delay+"s"
    );

    layer.appendChild(particle);

  }

  for(let i=0;i<flameCount;i++){

    createParticle(
      "ly-fire-flame",
      i,
      10
    );

  }

  for(let i=0;i<emberCount;i++){

    createParticle(
      "ly-fire-ember",
      i,
      200
    );

  }

  /* 系統切換為減少動畫時，立即隱藏 */

  function updateMotion(){
    layer.hidden=motionPreference.matches;
  }

  if(motionPreference.addEventListener){

    motionPreference.addEventListener(
      "change",
      updateMotion
    );

  }

})();
</script>
