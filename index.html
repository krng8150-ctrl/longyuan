<html lang="zh-TW">

<meta charset="UTF-8">

<title>遊戲介紹｜龍淵天堂</title>

<style>
/* =====================================
   基本設定與龍淵背景
===================================== */

*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  font-family:"Microsoft JhengHei",Arial,sans-serif;
  color:#eef7ff;
  background:#07111f;
  line-height:1.85;
  isolation:isolate;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  z-index:-1;
  pointer-events:none;
  background:
    linear-gradient(
      180deg,
      rgba(3,9,20,.38),
      rgba(3,9,20,.85)
    ),
    url("longyuan-bg.png") center / cover no-repeat;
}

a{
  color:inherit;
  text-decoration:none;
}

h1,h2,h3,p,li,a{
  overflow-wrap:anywhere;
}

a:focus-visible,
.table-wrap:focus-visible{
  outline:2px solid #91d4ff;
  outline-offset:5px;
}

/* =====================================
   頂部導覽
===================================== */

.nav{
  background:rgba(4,12,28,.94);
  border-bottom:1px solid rgba(163,213,255,.22);
  backdrop-filter:blur(10px);
}

.nav-inner{
  max-width:1180px;
  margin:auto;
  padding:17px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:14px;
}

.brand{
  font-size:25px;
  font-weight:bold;
  letter-spacing:3px;
  text-shadow:0 0 18px #469de7;
}

.nav-links{
  display:flex;
  flex-wrap:wrap;
  gap:18px;
  font-size:14px;
}

.nav-links a:hover,
.breadcrumb a:hover{
  color:#91d4ff;
}

/* =====================================
   頁面與標題
===================================== */

.page{
  max-width:1180px;
  margin:auto;
  padding:30px 20px 65px;
}

.breadcrumb{
  display:flex;
  flex-wrap:wrap;
  gap:9px;
  margin-bottom:22px;
  color:#b8d7ed;
  font-size:13px;
}

.page-header{
  padding:30px;
  margin-bottom:24px;
  border:1px solid rgba(166,214,255,.25);
  border-radius:17px;
  background:rgba(5,16,32,.86);
  backdrop-filter:blur(5px);
}

.eyebrow{
  margin:0 0 10px;
  color:#a6d4f5;
  font-size:11px;
  letter-spacing:4px;
}

.title-row{
  display:flex;
  align-items:center;
  gap:14px;
}

.page-icon{
  flex-shrink:0;
  font-family:
    "Segoe UI Emoji",
    "Apple Color Emoji",
    "Noto Color Emoji",
    sans-serif;
  font-size:35px;
  filter:drop-shadow(0 0 8px #69c3ff70);
}

h1{
  margin:0;
  font-size:34px;
  line-height:1.5;
  text-shadow:0 0 18px #62b7ff80;
}

.page-summary{
  color:#c2dbed;
  margin-bottom:0;
}

.status{
  display:inline-block;
  margin-top:14px;
  padding:4px 10px;
  border:1px solid #f5c37566;
  border-radius:6px;
  color:#f5d39d;
  font-size:12px;
}

/* =====================================
   共用內容區塊
===================================== */

.panel{
  margin-bottom:24px;
  padding:26px;
  border:1px solid rgba(166,214,255,.2);
  border-radius:17px;
  background:rgba(5,16,32,.88);
  backdrop-filter:blur(5px);
  box-shadow:0 10px 35px #0003;
}

.panel h2{
  margin:0 0 20px;
  padding-bottom:12px;
  border-bottom:1px solid rgba(162,210,255,.18);
  font-size:25px;
  text-shadow:0 0 12px #65bbff60;
}

.panel p,
.panel li{
  color:#c4dced;
}

.panel li{
  margin-bottom:8px;
}

.pending{
  padding:16px 18px;
  border-left:3px solid #79bced;
  background:rgba(145,196,239,.06);
}

/* =====================================
   系統入口與圖示
===================================== */

.entry-grid{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:14px;
}

.entry{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  min-width:0;
  min-height:150px;
  padding:22px 14px;
  text-align:center;
  border:1px solid rgba(158,210,255,.23);
  border-radius:13px;
  background:linear-gradient(
    145deg,
    rgba(25,51,80,.72),
    rgba(7,22,42,.86)
  );
  transition:
    transform .2s,
    border-color .2s,
    box-shadow .2s;
}

.entry:hover{
  transform:translateY(-3px);
  border-color:#85caff;
  box-shadow:0 0 20px #49a0f22e;
}

.entry-icon{
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:46px;
  margin-bottom:10px;
  font-family:
    "Segoe UI Emoji",
    "Apple Color Emoji",
    "Noto Color Emoji",
    sans-serif;
  font-size:32px;
  filter:drop-shadow(0 0 7px #69c3ff80);
}

.entry strong{
  font-size:17px;
  line-height:1.6;
}

.entry small{
  margin-top:8px;
  color:#b0cee3;
  font-size:12px;
  line-height:1.7;
}

/* =====================================
   轉生變身能力卡片
===================================== */

.transform-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:20px;
}

.transform-card{
  min-width:0;
  padding:22px;
  border:1px solid rgba(180,220,255,.18);
  border-radius:16px;
  background:rgba(255,255,255,.045);
}

.transform-card h3{
  margin:0 0 15px;
  font-size:24px;
  line-height:1.6;
}

.transform-card p{
  margin:7px 0;
  font-size:15px;
  line-height:1.95;
}

.legend{
  color:#ff9adf;
  text-shadow:0 0 8px #ff5abe60;
}

.myth{
  color:#ffd36a;
  text-shadow:0 0 8px #ffbe3c60;
}

.awakening{
  color:#b8a6ff;
  text-shadow:0 0 8px #8c78ff60;
}

.blue{
  color:#73e9ff;
  text-shadow:0 0 8px #50caff60;
}

.accelerated{
  color:#ffbb79;
  text-shadow:0 0 8px #ff943c60;
}

/* =====================================
   能力比較表
===================================== */

.table-note{
  font-size:13px;
}

.table-wrap{
  max-width:100%;
  overflow-x:auto;
  border:1px solid rgba(180,220,255,.18);
  border-radius:10px;
}

table{
  width:100%;
  min-width:1650px;
  border-collapse:collapse;
  font-size:14px;
  font-variant-numeric:tabular-nums;
}

caption{
  padding:12px;
  color:#d9edfc;
  text-align:left;
}

th,td{
  padding:13px 12px;
  border:1px solid rgba(180,220,255,.14);
  text-align:center;
  white-space:nowrap;
}

thead th{
  background:#17324d;
  color:#fff;
}

tbody th{
  background:#10233a;
  text-align:left;
}

tbody tr:hover{
  background:rgba(120,180,255,.08);
}

/* =====================================
   返回導覽與頁尾
===================================== */

.return-links{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:12px;
  margin-top:30px;
}

.btn{
  display:inline-block;
  padding:12px 24px;
  border:1px solid #75bbef;
  border-radius:10px;
  background:rgba(13,44,76,.9);
  text-align:center;
}

.btn:hover{
  background:rgba(32,83,128,.9);
}

.footer{
  padding:25px 20px;
  text-align:center;
  border-top:1px solid rgba(145,205,255,.15);
  color:#aac6dc;
  font-size:13px;
}

/* =====================================
   手機與平板
===================================== */

@media(max-width:900px){
  .entry-grid{
    grid-template-columns:repeat(3,minmax(0,1fr));
  }

  .transform-grid{
    grid-template-columns:1fr;
  }
}

@media(max-width:700px){
  .nav-inner{
    justify-content:center;
  }

  .nav-links{
    justify-content:center;
    gap:14px;
  }

  .entry-grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }
}

@media(max-width:480px){
  .page{
    padding:22px 14px 45px;
  }

  .brand{
    font-size:23px;
  }

  .nav-links{
    font-size:13px;
    gap:12px;
  }

  .page-header,
  .panel{
    padding:21px 16px;
  }

  h1{
    font-size:26px;
  }

  .page-icon{
    font-size:28px;
  }

  .title-row{
    gap:10px;
  }

  .panel h2{
    font-size:22px;
  }

  .entry-grid{
    gap:10px;
  }

  .entry{
    min-height:140px;
    padding:18px 9px;
  }

  .entry strong{
    font-size:15px;
  }

  .entry small{
    font-size:11px;
  }

  .entry-icon{
    font-size:29px;
  }

  .transform-card{
    padding:18px 15px;
  }

  .transform-card h3{
    font-size:21px;
  }

  .transform-card p{
    font-size:14px;
  }

  .return-links .btn{
    flex:1 1 100%;
  }
}

@media(prefers-reduced-motion:reduce){
  *{
    transition:none!important;
  }
}
</style>
</head>

const byId=id=>document.getElementById(id);

function element(tag,className,text){
  const node=document.createElement(tag);

  if(className){
    node.className=className;
  }

  if(text!==undefined){
    node.textContent=text;
  }

  return node;
}

function pageURL(page,path=[]){
  const params=new URLSearchParams();

  params.set("page",page);

  if(path.length){
    params.set("path",path.join("/"));
  }

  return "intro.html?"+params.toString();
}

function addBreadcrumb(text,url){
  const container=byId("breadcrumb");

  if(container.children.length){
    const divider=element("span","","›");
    divider.setAttribute("aria-hidden","true");
    container.appendChild(divider);
  }

  const node=element(url?"a":"span","",text);

  if(url){
    node.href=url;
  }else{
    node.setAttribute("aria-current","page");
  }

  container.appendChild(node);
}
