<meta charset="UTF-8">

<title>遊戲介紹｜龍淵天堂</title>

<style>
/* =====================================
   【01】基本設定與背景
===================================== */

*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  font-family:"Microsoft JhengHei",Arial,sans-serif;
  color:#eaf6ff;
  background:#07111f;
  line-height:1.85;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  z-index:-1;
  pointer-events:none;
  background:
    linear-gradient(
      180deg,
      rgba(3,9,20,.55),
      rgba(3,9,20,.85)
    ),
    url("longyuan-bg.png") center / cover no-repeat;
}

a{
  color:inherit;
  text-decoration:none;
}

button,input{
  font:inherit;
}

a:focus-visible,
button:focus-visible,
input:focus-visible{
  outline:2px solid #91d4ff;
  outline-offset:5px;
}

h1,h2,h3,p,a,li{
  overflow-wrap:anywhere;
}

/* =====================================
   【02】導覽
===================================== */

.nav{
  background:rgba(4,12,28,.94);
  border-bottom:1px solid rgba(163,213,255,.22);
}

.nav-inner{
  max-width:1180px;
  margin:auto;
  padding:17px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:14px;
}

.brand{
  font-size:25px;
  font-weight:900;
  letter-spacing:3px;
  text-shadow:0 0 18px #469de7;
}

.nav-links{
  display:flex;
  flex-wrap:wrap;
  gap:20px;
  font-size:14px;
}

.nav-links a:hover,
.breadcrumb a:hover{
  color:#91d4ff;
}

/* =====================================
   【03】介紹頁
===================================== */

.page{
  max-width:1100px;
  margin:auto;
  padding:30px 20px 65px;
}

.breadcrumb{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:9px;
  margin-bottom:22px;
  color:#a9cbe4;
  font-size:13px;
}

.page-header{
  padding:32px;
  margin-bottom:24px;
  background:rgba(5,16,32,.88);
  border:1px solid rgba(166,214,255,.25);
  border-radius:16px;
}

.eyebrow{
  margin:0 0 10px;
  font-size:11px;
  letter-spacing:4px;
  color:#9bcdf2;
}

.page-header h1{
  margin:0 0 12px;
  font-size:34px;
  line-height:1.5;
  text-shadow:0 0 18px rgba(98,183,255,.6);
}

.page-header p:last-child{
  margin-bottom:0;
  color:#bfd7e9;
}

.status{
  display:inline-block;
  margin-top:14px;
  padding:4px 10px;
  border:1px solid rgba(245,195,117,.4);
  border-radius:6px;
  color:#f5d39d;
  font-size:12px;
}

.panel{
  margin-bottom:22px;
  padding:26px;
  border:1px solid rgba(166,214,255,.2);
  border-radius:15px;
  background:rgba(5,16,32,.9);
}

.panel h2{
  margin:0 0 16px;
  padding-bottom:12px;
  border-bottom:1px solid rgba(162,210,255,.18);
  font-size:23px;
}

.panel p{
  color:#c4dced;
}

.panel li{
  margin-bottom:9px;
  color:#c4dced;
}

.pending{
  padding:16px 18px;
  background:rgba(145,196,239,.06);
  border-left:3px solid #79bced;
  color:#b9d3e6;
}

.entry-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:14px;
}

.entry{
  display:block;
  min-width:0;
  padding:22px;
  border:1px solid rgba(158,210,255,.23);
  border-radius:12px;
  background:linear-gradient(
    145deg,
    rgba(25,51,80,.8),
    rgba(7,22,42,.9)
  );
  transition:transform .2s,border-color .2s;
}

.entry:hover{
  transform:translateY(-3px);
  border-color:#85caff;
}

.entry strong{
  display:block;
  font-size:18px;
}

.entry small{
  display:block;
  color:#a8c7de;
  margin-top:8px;
}

.tags{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin:16px 0;
}

.tag{
  padding:6px 12px;
  border:1px solid rgba(158,210,255,.2);
  border-radius:7px;
  background:rgba(120,190,255,.05);
  color:#c6e3f6;
  font-size:14px;
}

.return-links{
  display:flex;
  flex-wrap:wrap;
  gap:12px;
  margin-top:28px;
}

.btn{
  display:inline-block;
  padding:11px 22px;
  border:1px solid #75bbef;
  border-radius:8px;
  background:rgba(13,44,76,.9);
  text-align:center;
}

.btn:hover{
  background:rgba(32,83,128,.9);
}

.footer{
  padding:25px 20px;
  text-align:center;
  border-top:1px solid rgba(145,205,255,.15);
  font-size:13px;
  color:#9eb9d0;
}

@media(max-width:750px){
  .entry-grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }

  .nav-inner{
    justify-content:center;
  }
}

@media(max-width:480px){
  .page{
    padding:22px 14px 45px;
  }

  .page-header,
  .panel{
    padding:21px 18px;
  }

  .page-header h1{
    font-size:27px;
  }

  .panel h2{
    font-size:21px;
  }

  .entry-grid{
    grid-template-columns:1fr;
  }

  .return-links .btn{
    flex:1 1 100%;
  }
}

@media(prefers-reduced-motion:reduce){
  *{
    transition:none!important;
  }
}
</style>
</head>

/* =====================================
   【05】頁面顯示程式
   日常編輯通常只需修改上方 INTRO_DATA
===================================== */

const byId = id => document.getElementById(id);

function element(tag,className,text){
  const item=document.createElement(tag);

  if(className){
    item.className=className;
  }

  if(text!==undefined){
    item.textContent=text;
  }

  return item;
}

function pageURL(page,path=[]){
  const params=new URLSearchParams();

  params.set("page",page);

  if(path.length){
    params.set("path",path.join("/"));
  }

  return "intro.html?"+params.toString();
}

function addBreadcrumb(text,url){
  const container=byId("breadcrumb");

  if(container.children.length){
    const divider=element("span","","›");
    divider.setAttribute("aria-hidden","true");
    container.appendChild(divider);
  }

  const item=element(url?"a":"span","",text);

  if(url){
    item.href=url;
  }else{
    item.setAttribute("aria-current","page");
  }

  container.appendChild(item);
}

function makePanel(title){
  const section=element("section","panel");

  if(title){
    section.appendChild(element("h2","",title));
  }

  return section;
}

function addCards(items,page,path=[]){
  const section=makePanel(page?"選擇分類":"介紹入口");
  const grid=element("div","entry-grid");

  items.forEach(item=>{
    const link=element("a","entry");

    link.href=page
      ?pageURL(page,[...path,item.id])
      :pageURL(item.id);

    link.appendChild(element("strong","",item.title));

    const description=item.summary ||
      (item.children?.length
        ?"進入下一層分類 →"
        :"查看介紹・詳細資料整理中 →");

    link.appendChild(element("small","",description));

    grid.appendChild(link);
  });

  section.appendChild(grid);
  byId("page-content").appendChild(section);
}

function showUnknown(){
  byId("page-title").textContent="找不到這個介紹項目";
  byId("page-summary").textContent=
    "請由介紹入口重新選擇想查看的項目。";

  byId("page-status").textContent="項目不存在";

  addBreadcrumb("首頁","index.html");
  addBreadcrumb("介紹入口","intro.html");
  addBreadcrumb("找不到項目");

  byId("back-link").href="intro.html";
  document.title="找不到介紹項目｜龍淵天堂";
}

function render(){
  const params=new URLSearchParams(location.search);
  const page=params.get("page");

  if(!page){
    byId("page-title").textContent="遊戲介紹入口";
    byId("page-summary").textContent=
      "選擇想了解的系統，進入對應介紹。";

    byId("page-status").textContent=
      "已建立基本介紹・正式設定陸續補齊";

    byId("back-link").href="index.html";

    addBreadcrumb("首頁","index.html");
    addBreadcrumb("介紹入口");

    addCards(INTRO_DATA);

    document.title="介紹入口｜龍淵天堂";
    return;
  }

  const root=INTRO_DATA.find(item=>item.id===page);

  if(!root){
    showUnknown();
    return;
  }

  const pathValue=params.get("path")||"";
  const path=pathValue?pathValue.split("/"):[];

  let current=root;
  const chain=[root];

  for(const id of path){
    const child=(current.children||[]).find(
      item=>item.id===id
    );

    if(!child){
      showUnknown();
      return;
    }

    current=child;
    chain.push(child);
  }

  document.title=current.title+"｜龍淵天堂";

  byId("page-title").textContent=current.title;

  byId("page-summary").textContent=
    current.summary ||
    root.title+"｜"+current.title+"介紹。";

  byId("page-status").textContent=
    "基本介紹・正式設定待確認";

  addBreadcrumb("首頁","index.html");
  addBreadcrumb("介紹入口","intro.html");

  chain.forEach((item,index)=>{
    const isCurrent=index===chain.length-1;

    const url=isCurrent
      ?null
      :pageURL(page,path.slice(0,index));

    addBreadcrumb(item.title,url);
  });

  const paragraphs=current.paragraphs ||
    [
      "本區整理"+current.title+"的分類資訊。",
      "詳細能力、取得方式與相關條件，將於龍淵資料確認後補上。"
    ];

  const overview=makePanel("系統介紹");

  paragraphs.forEach(text=>{
    overview.appendChild(element("p","",text));
  });

  byId("page-content").appendChild(overview);

  if(current.points?.length){
    const section=makePanel("分類與介紹項目");
    const list=element("ul");

    current.points.forEach(text=>{
      list.appendChild(element("li","",text));
    });

    section.appendChild(list);
    byId("page-content").appendChild(section);
  }

  if(current.children?.length){
    addCards(current.children,page,path);
  }

  const pending=makePanel("資料更新狀態");

  pending.appendChild(
    element(
      "p",
      "pending",
      current.pending ||
      root.pending ||
      "詳細資料整理中。"
    )
  );

  byId("page-content").appendChild(pending);

  byId("back-link").href=path.length
    ?pageURL(page,path.slice(0,-1))
    :"intro.html";
}

render();
</script>
