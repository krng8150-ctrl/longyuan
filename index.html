<!DOCTYPE html>
<html lang="zh-TW">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#07111f">

<title>遊戲介紹｜龍淵天堂</title>

<style>

/* =====================================
   【01】基本設定
===================================== */

*{
  box-sizing:border-box;
}

html{
  min-height:100%;
}

body{
  margin:0;
  min-height:100vh;
  font-family:"Microsoft JhengHei",Arial,sans-serif;
  color:#eaf6ff;
  background:#07111f;
  line-height:1.85;
  isolation:isolate;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  z-index:-1;
  pointer-events:none;

  background:
    linear-gradient(
      180deg,
      rgba(3,9,20,.45),
      rgba(3,9,20,.82)
    ),
    url("longyuan-bg.png")
    center center / cover no-repeat;
}

a{
  color:inherit;
  text-decoration:none;
}

button,input{
  font:inherit;
}

a:focus-visible,
button:focus-visible,
input:focus-visible{
  outline:2px solid #91d4ff;
  outline-offset:5px;
}

h1,h2,h3,p,a,li{
  overflow-wrap:anywhere;
}

/* =====================================
   【02】頂部導覽
===================================== */

.nav{
  position:relative;
  z-index:10;
  background:rgba(4,12,28,.94);
  border-bottom:1px solid rgba(163,213,255,.22);
  backdrop-filter:blur(10px);
}

.nav-inner{
  max-width:1180px;
  margin:auto;
  padding:17px 20px;

  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:14px;
}

.brand{
  font-size:25px;
  font-weight:900;
  letter-spacing:3px;
  text-shadow:0 0 18px #469de7;
}

.nav-links{
  display:flex;
  flex-wrap:wrap;
  gap:20px;
  font-size:14px;
}

.nav-links a:hover,
.breadcrumb a:hover{
  color:#91d4ff;
}

/* =====================================
   【03】介紹頁版面
===================================== */

.page{
  width:100%;
  max-width:1180px;
  margin:auto;
  padding:30px 20px 65px;
}

.breadcrumb{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:9px;

  margin-bottom:22px;
  color:#b8d7ed;
  font-size:13px;
}

.page-header{
  padding:30px;
  margin-bottom:24px;
  background:rgba(5,16,32,.86);
  border:1px solid rgba(166,214,255,.25);
  border-radius:16px;
  backdrop-filter:blur(5px);
}

.eyebrow{
  margin:0 0 10px;
  font-size:11px;
  letter-spacing:4px;
  color:#a6d4f5;
}

.title-row{
  display:flex;
  align-items:center;
  gap:14px;
}

.page-icon{
  flex-shrink:0;
  font-family:
    "Segoe UI Emoji",
    "Apple Color Emoji",
    "Noto Color Emoji",
    sans-serif;
  font-size:35px;
  line-height:1.4;
  filter:drop-shadow(0 0 8px rgba(105,195,255,.45));
}

.page-header h1{
  margin:0;
  font-size:34px;
  line-height:1.5;
  text-shadow:0 0 18px rgba(98,183,255,.6);
}

.page-header p:last-of-type{
  margin-bottom:0;
  color:#c2dbed;
}

.status{
  display:inline-block;
  margin-top:14px;
  padding:4px 10px;

  border:1px solid rgba(245,195,117,.4);
  border-radius:6px;
  color:#f5d39d;
  font-size:12px;
}

.panel{
  margin-bottom:22px;
  padding:26px;

  border:1px solid rgba(166,214,255,.2);
  border-radius:15px;
  background:rgba(5,16,32,.87);
  backdrop-filter:blur(5px);

  box-shadow:0 10px 35px rgba(0,0,0,.18);
}

.panel h2{
  margin:0 0 20px;
  padding-bottom:12px;

  border-bottom:1px solid rgba(162,210,255,.18);
  font-size:23px;
  text-shadow:0 0 12px rgba(101,187,255,.35);
}

.panel p{
  color:#c4dced;
}

.panel li{
  margin-bottom:9px;
  color:#c4dced;
}

.pending{
  margin-bottom:0;
  padding:16px 18px;

  background:rgba(145,196,239,.06);
  border-left:3px solid #79bced;
  color:#bfd8eb;
}

/* =====================================
   【04】系統入口與小圖示
===================================== */

.entry-grid{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:14px;
}

.entry{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  min-width:0;
  min-height:150px;
  padding:22px 14px;
  text-align:center;

  border:1px solid rgba(158,210,255,.23);
  border-radius:12px;

  background:linear-gradient(
    145deg,
    rgba(25,51,80,.72),
    rgba(7,22,42,.86)
  );

  transition:
    transform .2s,
    border-color .2s,
    box-shadow .2s;
}

.entry:hover{
  transform:translateY(-3px);
  border-color:#85caff;
  box-shadow:0 0 20px rgba(73,160,242,.18);
}

.entry-icon{
  display:flex;
  align-items:center;
  justify-content:center;

  min-height:46px;
  margin-bottom:10px;

  font-family:
    "Segoe UI Emoji",
    "Apple Color Emoji",
    "Noto Color Emoji",
    sans-serif;

  font-size:32px;
  line-height:1.4;

  filter:drop-shadow(
    0 0 7px rgba(105,195,255,.5)
  );
}

.entry strong{
  display:block;
  font-size:17px;
  line-height:1.6;
}

.entry small{
  display:block;
  margin-top:8px;
  color:#b0cee3;
  font-size:12px;
  line-height:1.7;
}

/* =====================================
   【05】返回導覽
===================================== */

.return-links{
  display:flex;
  flex-wrap:wrap;
  gap:12px;
  margin-top:28px;
}

.btn{
  display:inline-block;
  padding:11px 22px;
  border:1px solid #75bbef;
  border-radius:8px;
  background:rgba(13,44,76,.9);
  text-align:center;
}

.btn:hover{
  background:rgba(32,83,128,.9);
}

.footer{
  padding:25px 20px;
  text-align:center;
  border-top:1px solid rgba(145,205,255,.15);
  font-size:13px;
  color:#aac6dc;
}

/* =====================================
   【06】平板與手機版
===================================== */

@media(max-width:900px){

  .entry-grid{
    grid-template-columns:repeat(3,minmax(0,1fr));
  }

}

@media(max-width:700px){

  .nav-inner{
    justify-content:center;
  }

  .nav-links{
    justify-content:center;
    gap:15px;
  }

  .entry-grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }

}

@media(max-width:480px){

  .page{
    padding:22px 14px 45px;
  }

  .brand{
    font-size:23px;
  }

  .nav-links{
    font-size:13px;
    gap:12px;
  }

  .page-header,
  .panel{
    padding:21px 16px;
  }

  .page-header h1{
    font-size:26px;
  }

  .page-icon{
    font-size:28px;
  }

  .title-row{
    gap:10px;
  }

  .panel h2{
    font-size:21px;
  }

  .entry-grid{
    gap:10px;
  }

  .entry{
    min-height:145px;
    padding:18px 9px;
  }

  .entry strong{
    font-size:15px;
  }

  .entry small{
    font-size:11px;
  }

  .entry-icon{
    font-size:29px;
  }

  .return-links .btn{
    flex:1 1 100%;
  }

}

@media(prefers-reduced-motion:reduce){

  *{
    transition:none!important;
  }

}

</style>
</head>

/* =====================================
   【11】共用工具
===================================== */

const byId=id=>document.getElementById(id);

function element(tag,className,text){

  const item=document.createElement(tag);

  if(className){
    item.className=className;
  }

  if(text!==undefined){
    item.textContent=text;
  }

  return item;

}

function getIcon(item,rootId){

  return item.icon ||
    ENTRY_ICONS[item.id] ||
    ENTRY_ICONS[rootId] ||
    "◇";

}

function pageURL(page,path=[]){

  const params=new URLSearchParams();

  params.set("page",page);

  if(path.length){
    params.set("path",path.join("/"));
  }

  return "intro.html?"+params.toString();

}

/* =====================================
   【12】目前位置導覽
===================================== */

function addBreadcrumb(text,url){

  const container=byId("breadcrumb");

  if(container.children.length){

    const divider=element("span","","›");

    divider.setAttribute("aria-hidden","true");

    container.appendChild(divider);

  }

  const item=element(url?"a":"span","",text);

  if(url){

    item.href=url;

  }else{

    item.setAttribute("aria-current","page");

  }

  container.appendChild(item);

}

/* =====================================
   【13】內容區塊
===================================== */

function makePanel(title){

  const section=element("section","panel");

  if(title){

    section.appendChild(
      element("h2","",title)
    );

  }

  return section;

}

/* =====================================
   【14】顯示入口卡片與小圖示
===================================== */

function addCards(items,page,path=[]){

  const section=makePanel(
    page?"選擇分類":"系統入口"
  );

  const grid=element("div","entry-grid");

  items.forEach(item=>{

    const link=element("a","entry");

    link.href=page
      ?pageURL(page,[...path,item.id])
      :pageURL(item.id);

    const icon=element(
      "div",
      "entry-icon",
      getIcon(item,page)
    );

    icon.setAttribute("aria-hidden","true");

    link.appendChild(icon);

    link.appendChild(
      element("strong","",item.title)
    );

    const description=item.summary ||
      (item.children?.length
        ?"進入下一層分類 →"
        :"查看介紹・詳細資料整理中 →");

    link.appendChild(
      element("small","",description)
    );

    grid.appendChild(link);

  });

  section.appendChild(grid);

  byId("page-content").appendChild(section);

}

/* =====================================
   【15】找不到項目時
===================================== */

function showUnknown(){

  byId("breadcrumb").replaceChildren();
  byId("page-content").replaceChildren();

  byId("page-icon").textContent="📖";

  byId("page-title").textContent=
    "找不到這個介紹項目";

  byId("page-summary").textContent=
    "請由介紹入口重新選擇想查看的項目。";

  byId("page-status").textContent=
    "項目不存在";

  addBreadcrumb("首頁","index.html");
  addBreadcrumb("介紹入口","intro.html");
  addBreadcrumb("找不到項目");

  byId("back-link").href="intro.html";

  document.title=
    "找不到介紹項目｜龍淵天堂";

}

/* =====================================
   【16】顯示介紹頁
===================================== */

function render(){

  byId("breadcrumb").replaceChildren();
  byId("page-content").replaceChildren();

  const params=new URLSearchParams(
    location.search
  );

  const page=params.get("page");

  /* 沒有指定項目：顯示全部系統入口 */

  if(!page){

    byId("page-icon").textContent="🐉";

    byId("page-title").textContent=
      "遊戲介紹入口";

    byId("page-summary").textContent=
      "選擇想了解的系統，進入對應介紹。";

    byId("page-status").textContent=
      "基本介紹已建立・正式設定陸續補齊";

    byId("back-link").href="index.html";

    addBreadcrumb("首頁","index.html");
    addBreadcrumb("介紹入口");

    addCards(INTRO_DATA);

    document.title=
      "介紹入口｜龍淵天堂";

    return;

  }

  /* 尋找主分類 */

  const root=INTRO_DATA.find(
    item=>item.id===page
  );

  if(!root){

    showUnknown();
    return;

  }

  /* 尋找下一層分類 */

  const pathValue=params.get("path")||"";

  const path=pathValue
    ?pathValue.split("/")
    :[];

  let current=root;

  const chain=[root];

  for(const id of path){

    const child=(current.children||[]).find(
      item=>item.id===id
    );

    if(!child){

      showUnknown();
      return;

    }

    current=child;
    chain.push(child);

  }

  /* 頁面標題 */

  document.title=
    current.title+"｜龍淵天堂";

  byId("page-icon").textContent=
    getIcon(current,root.id);

  byId("page-title").textContent=
    current.title;

  byId("page-summary").textContent=
    current.summary ||
    root.title+"｜"+current.title+"介紹。";

  byId("page-status").textContent=
    "基本介紹・正式設定待確認";

  /* 目前位置 */

  addBreadcrumb("首頁","index.html");
  addBreadcrumb("介紹入口","intro.html");

  chain.forEach((item,index)=>{

    const isCurrent=
      index===chain.length-1;

    const url=isCurrent
      ?null
      :pageURL(
        page,
        path.slice(0,index)
      );

    addBreadcrumb(item.title,url);

  });

  /* 介紹段落 */

  const paragraphs=current.paragraphs || [

    "本區整理"+current.title+"的分類資訊。",

    "詳細能力、取得方式與相關條件，將於龍淵資料確認後補上。"

  ];

  const overview=makePanel("系統介紹");

  paragraphs.forEach(text=>{

    overview.appendChild(
      element("p","",text)
    );

  });

  byId("page-content").appendChild(
    overview
  );

  /* 條列內容 */

  if(current.points?.length){

    const section=makePanel(
      "分類與介紹項目"
    );

    const list=element("ul");

    current.points.forEach(text=>{

      list.appendChild(
        element("li","",text)
      );

    });

    section.appendChild(list);

    byId("page-content").appendChild(
      section
    );

  }

  /* 子分類入口 */

  if(current.children?.length){

    addCards(
      current.children,
      page,
      path
    );

  }

  /* 資料狀態 */

  const pending=makePanel(
    "資料更新狀態"
  );

  pending.appendChild(

    element(
      "p",
      "pending",

      current.pending ||
      root.pending ||
      "詳細資料整理中。"

    )

  );

  byId("page-content").appendChild(
    pending
  );

  /* 返回上一層 */

  byId("back-link").href=path.length

    ?pageURL(
      page,
      path.slice(0,-1)
    )

    :"intro.html";

}

/* =====================================
   【17】啟動
===================================== */

render();

</script>
