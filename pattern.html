<style>

/* =====================================
   【01】基本設定與背景
===================================== */

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
  scroll-padding-top:25px;
}

body{
  margin:0;
  min-height:100vh;
  font-family:"Microsoft JhengHei",Arial,sans-serif;
  color:#eef7ff;
  background:#07111f;
  line-height:1.85;
  isolation:isolate;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  z-index:-1;
  pointer-events:none;

  background:
    linear-gradient(
      180deg,
      rgba(3,10,22,.45),
      rgba(3,10,22,.88)
    ),
    url("longyuan-bg.png")
    center center / cover no-repeat;
}

a{
  color:inherit;
  text-decoration:none;
}

a:focus-visible{
  outline:2px solid #91d4ff;
  outline-offset:5px;
}

h1,h2,h3,p{
  overflow-wrap:anywhere;
}

/* =====================================
   【02】頂部導覽
===================================== */

.nav{
  background:rgba(4,12,28,.94);
  border-bottom:1px solid rgba(180,220,255,.22);
  backdrop-filter:blur(10px);
}

.nav-inner{
  max-width:1280px;
  margin:auto;
  padding:17px 20px;

  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:16px;
}

.brand{
  font-size:26px;
  font-weight:bold;
  letter-spacing:3px;
  text-shadow:0 0 16px rgba(98,183,255,.65);
}

.nav-links{
  display:flex;
  flex-wrap:wrap;
  gap:20px;
  font-size:14px;
}

.nav-links a:hover{
  color:#91d4ff;
}

/* =====================================
   【03】頁面標題
===================================== */

.wrapper{
  max-width:1280px;
  margin:auto;
  padding:35px 20px 65px;
}

.page-header{
  text-align:center;
  padding:15px 0 30px;
}

.eyebrow{
  margin:0 0 12px;
  color:#a9d8ff;
  font-size:12px;
  letter-spacing:4px;
}

.main-title{
  margin:0 0 14px;
  font-size:clamp(34px,5vw,54px);
  line-height:1.5;
  letter-spacing:4px;

  text-shadow:
    0 0 12px rgba(143,210,255,.65),
    0 0 28px rgba(45,125,255,.45);
}

.sub-title{
  margin:0;
  font-size:17px;
  color:#dcefff;
}

/* =====================================
   【04】紋樣快速入口
===================================== */

.pattern-nav{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:10px;
  margin-top:24px;
}

.pattern-nav a{
  display:inline-block;
  padding:9px 16px;

  border:1px solid rgba(180,220,255,.28);
  border-radius:9px;
  background:rgba(15,43,72,.92);

  font-size:14px;
}

.pattern-nav a:hover{
  background:rgba(36,82,125,.95);
  border-color:#91d4ff;
}

/* =====================================
   【05】內容區塊
===================================== */

.panel{
  margin-bottom:28px;
  padding:28px;

  background:rgba(8,18,38,.89);
  border:1px solid rgba(180,220,255,.2);
  border-radius:18px;

  backdrop-filter:blur(6px);
  box-shadow:0 10px 30px rgba(0,0,0,.22);
}

.section-title{
  margin:0 0 20px;
  padding-bottom:13px;

  font-size:27px;
  line-height:1.6;

  border-bottom:1px solid rgba(180,220,255,.18);
}

.description{
  margin:0;
  color:#c9dfef;
}

.pattern-section{
  scroll-margin-top:25px;
}

.pattern-section.earth .section-title{
  color:#f1d094;
}

.pattern-section.wind .section-title{
  color:#a0efca;
}

.pattern-section.holy .section-title{
  color:#fff0b5;
}

.pattern-section.fire .section-title{
  color:#ffb18c;
}

.pattern-section.water .section-title{
  color:#9edfff;
}

/* =====================================
   【06】三階段能力表
===================================== */

.level-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:18px;
}

.level-card{
  min-width:0;
  overflow:hidden;

  border:1px solid rgba(180,220,255,.18);
  border-radius:12px;
  background:rgba(255,255,255,.035);
}

.level-card h3{
  margin:0;
  padding:15px;

  font-size:19px;
  color:#dcefff;

  background:rgba(120,190,255,.08);
  border-bottom:1px solid rgba(180,220,255,.16);
}

table{
  width:100%;
  border-collapse:collapse;
  font-size:14px;
  font-variant-numeric:tabular-nums;
}

th,td{
  padding:11px 12px;
  border-bottom:1px solid rgba(180,220,255,.12);
  text-align:left;
  vertical-align:top;
}

thead th{
  color:#c1def3;
  font-weight:normal;
  background:rgba(7,22,42,.55);
}

tbody th{
  width:60px;
  white-space:nowrap;
  color:#b9e1ff;
}

tbody td{
  color:#e0edf7;
}

tbody tr:last-child th,
tbody tr:last-child td{
  border-bottom:0;
}

tbody tr:hover{
  background:rgba(120,180,255,.06);
}

.stat-line{
  display:block;
  line-height:1.9;
}

.final-row{
  background:rgba(120,190,255,.07);
}

/* =====================================
   【07】Lv30最終效果
===================================== */

.final-box{
  margin-top:20px;
  padding:20px;

  border:1px solid rgba(255,215,143,.35);
  border-radius:12px;

  background:linear-gradient(
    135deg,
    rgba(92,66,24,.3),
    rgba(22,31,48,.7)
  );
}

.final-box h3{
  margin:0 0 14px;
  font-size:20px;
  color:#ffdfa7;
}

.final-stats{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
}

.stat-chip{
  display:inline-block;
  padding:7px 12px;

  border:1px solid rgba(255,215,143,.2);
  border-radius:7px;

  background:rgba(255,225,165,.04);
  color:#f4e4c9;
  font-size:14px;
}

/* =====================================
   【08】返回與頁尾
===================================== */

.back-wrap{
  display:flex;
  justify-content:center;
  margin-top:30px;
}

.back-btn{
  display:inline-block;
  min-width:210px;
  padding:13px 26px;

  text-align:center;
  border-radius:10px;

  background:rgba(15,47,79,.94);
  border:1px solid rgba(180,220,255,.35);
}

.back-btn:hover{
  background:rgba(34,80,125,.94);
}

.footer{
  padding:25px 20px;
  text-align:center;
  color:#aac7dc;
  font-size:13px;
  border-top:1px solid rgba(180,220,255,.14);
}

/* =====================================
   【09】平板與手機
===================================== */

@media(max-width:1000px){

  .level-grid{
    grid-template-columns:1fr;
  }

  tbody th{
    width:85px;
  }

}

@media(max-width:600px){

  .nav-inner{
    justify-content:center;
  }

  .nav-links{
    justify-content:center;
    gap:15px;
  }

  .wrapper{
    padding:24px 14px 45px;
  }

  .main-title{
    font-size:34px;
  }

  .sub-title{
    font-size:15px;
  }

  .panel{
    padding:21px 16px;
  }

  .section-title{
    font-size:23px;
  }

  .pattern-nav{
    gap:8px;
  }

  .pattern-nav a{
    padding:8px 12px;
    font-size:13px;
  }

  .final-box{
    padding:17px;
  }

  .back-btn{
    width:100%;
  }

}

@media(prefers-reduced-motion:reduce){

  html{
    scroll-behavior:auto;
  }

}

/* =====================================
   【16】建立紋樣內容
===================================== */

(function(){

  const container=document.getElementById(
    "pattern-content"
  );

  function element(tag,className,text){

    const node=document.createElement(tag);

    if(className){
      node.className=className;
    }

    if(text!==undefined){
      node.textContent=text;
    }

    return node;

  }

  PATTERNS.forEach(pattern=>{

    const levels=pattern.levels
      .trim()
      .split(/\r?\n/)
      .map(line=>{

        const match=line.trim().match(
          /^Lv(\d+)\s+(.+)$/
        );

        if(!match){
          throw new Error(
            "紋樣資料格式錯誤："+pattern.title
          );
        }

        return {
          level:Number(match[1]),
          stats:match[2].split(/\s*\/\s*/)
        };

      });

    if(
      levels.length!==30 ||
      levels.some((item,index)=>item.level!==index+1)
    ){
      throw new Error(
        "紋樣等級資料不完整："+pattern.title
      );
    }

    const section=element(
      "section",
      "panel pattern-section "+pattern.id
    );

    section.id=pattern.id;

    const title=element(
      "h2",
      "section-title",
      pattern.title
    );

    title.id=pattern.id+"-title";

    section.setAttribute(
      "aria-labelledby",
      title.id
    );

    section.appendChild(title);

    const grid=element(
      "div",
      "level-grid"
    );

    for(let band=0;band<3;band++){

      const start=band*10;
      const end=start+10;

      const card=element(
        "div",
        "level-card"
      );

      card.appendChild(

        element(
          "h3",
          "",
          "Lv"+(start+1)+"～"+end
        )

      );

      const table=element("table");

      table.setAttribute(
        "aria-label",
        pattern.title+" Lv"+(start+1)+"至Lv"+end
      );

      const thead=element("thead");
      const heading=element("tr");

      ["等級","能力效果"].forEach(label=>{

        const th=element("th","",label);

        th.setAttribute("scope","col");

        heading.appendChild(th);

      });

      thead.appendChild(heading);
      table.appendChild(thead);

      const tbody=element("tbody");

      levels.slice(start,end).forEach(item=>{

        const row=element(
          "tr",
          item.level===30?"final-row":""
        );

        const levelCell=element(
          "th",
          "",
          "Lv"+item.level
        );

        levelCell.setAttribute(
          "scope",
          "row"
        );

        row.appendChild(levelCell);

        const abilityCell=element("td");

        item.stats.forEach(stat=>{

          abilityCell.appendChild(

            element(
              "span",
              "stat-line",
              stat
            )

          );

        });

        row.appendChild(abilityCell);
        tbody.appendChild(row);

      });

      table.appendChild(tbody);
      card.appendChild(table);
      grid.appendChild(card);

    }

    section.appendChild(grid);

    const finalBox=element(
      "div",
      "final-box"
    );

    finalBox.appendChild(

      element(
        "h3",
        "",
        "Lv30 最終效果"
      )

    );

    const finalStats=element(
      "div",
      "final-stats"
    );

    levels[29].stats.forEach(stat=>{

      finalStats.appendChild(

        element(
          "span",
          "stat-chip",
          stat
        )

      );

    });

    finalBox.appendChild(finalStats);
    section.appendChild(finalBox);

    container.appendChild(section);

  });

})();
</script>

<script>
(function(){

  "use strict";

  if(document.getElementById("ly-rising-fire")){
    return;
  }

  const motionPreference=window.matchMedia(
    "(prefers-reduced-motion: reduce)"
  );

  if(motionPreference.matches){
    return;
  }

  const layer=document.createElement("div");

  layer.id="ly-rising-fire";

  layer.setAttribute(
    "aria-hidden",
    "true"
  );

  document.body.appendChild(layer);

  /* 火苗與餘燼數量 */

  const mobile=window.matchMedia(
    "(max-width:600px)"
  ).matches;

  const flameCount=mobile?6:12;
  const emberCount=mobile?8:16;

  function random(seed){

    const value=
      Math.sin(seed*127.1)*43758.5453;

    return value-Math.floor(value);

  }

  function updateTravel(){

    layer.style.setProperty(
      "--fire-travel",
      (window.innerHeight+100)+"px"
    );

  }

  updateTravel();

  window.addEventListener(
    "resize",
    updateTravel,
    {passive:true}
  );

  function createParticle(
    className,
    index,
    offset
  ){

    const particle=document.createElement(
      "span"
    );

    particle.className=className;

    const isFlame=
      className==="ly-fire-flame";

    const position=
      random(index+offset)*100;

    const size=isFlame
      ?4+random(index+offset+20)*5
      :1.5+random(index+offset+20)*2;

    const duration=isFlame
      ?11+random(index+offset+40)*8
      :14+random(index+offset+40)*10;

    const delay=
      -random(index+offset+60)*duration;

    particle.style.left=position+"%";

    particle.style.setProperty(
      "--fire-size",
      size+"px"
    );

    particle.style.setProperty(
      "--fire-duration",
      duration+"s"
    );

    particle.style.setProperty(
      "--fire-delay",
      delay+"s"
    );

    layer.appendChild(particle);

  }

  for(let i=0;i<flameCount;i++){

    createParticle(
      "ly-fire-flame",
      i,
      10
    );

  }

  for(let i=0;i<emberCount;i++){

    createParticle(
      "ly-fire-ember",
      i,
      200
    );

  }

  function updateMotion(){
    layer.hidden=motionPreference.matches;
  }

  if(motionPreference.addEventListener){

    motionPreference.addEventListener(
      "change",
      updateMotion
    );

  }

})();
</script>
